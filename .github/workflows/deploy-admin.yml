name: Deploy Admin App

on:
  push:
    branches:
      - main
    paths:
      - "QuantumSummerLab.Admin/**"
      - "QuantumSummerLab.Application/**"
      - "QuantumSummerLab.Copilot/**"
      - "QuantumSummerLab.Data/**"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore QuantumSummerLab.Admin/QuantumSummerLab.Admin.csproj

      - name: Publish application
        run: dotnet publish QuantumSummerLab.Admin/QuantumSummerLab.Admin.csproj --configuration Release --output publish/admin

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: quantumsummerlab2025-admin
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_ADMIN }}
          package: publish/admin
